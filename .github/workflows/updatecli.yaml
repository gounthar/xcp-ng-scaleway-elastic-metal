name: updatecli

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6am UTC

jobs:
  updatecli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.repository_owner == 'gounthar'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Updatecli
        uses: updatecli/updatecli-action@v3.6.0

      - name: Run Updatecli in Dry Run mode
        run: updatecli pipeline diff --config ./updatecli/updatecli.d
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Updatecli in Apply mode
        if: github.ref == 'refs/heads/main'
        run: updatecli pipeline apply --config ./updatecli/updatecli.d
        env:
          # A PAT is required here, not GITHUB_TOKEN: pushes touching
          # .github/workflows/ are rejected for tokens without the workflow
          # scope, and GITHUB_TOKEN is not allowed to open pull requests.
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.UPDATECLI_PAT }}
