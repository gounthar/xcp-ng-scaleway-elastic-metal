name: "Bump Debian netinst version"

scms:
  default:
    kind: github
    spec:
      user: "github-actions[bot]"
      email: "github-actions[bot]@users.noreply.github.com"
      owner: "gounthar"
      repository: "xcp-ng-scaleway-elastic-metal"
      branch: "main"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'

sources:
  debian:
    name: "Get latest Debian 12 point release from archive"
    kind: shell
    spec:
      # Piping curl straight into grep hides a failed fetch: the pipeline exits
      # with tr's status, so an unreachable cdimage.debian.org yields an empty
      # string that updatecli happily writes as DEBIAN_VER="".
      command: |
        set -eu
        index=$(curl -sfL --retry 5 --retry-delay 5 --retry-all-errors --max-time 60 \
          https://cdimage.debian.org/cdimage/archive/)
        version=$(printf '%s\n' "$index" |
          grep -oE '12\.[0-9]+\.[0-9]+/' |
          sort -t. -k1,1n -k2,2n -k3,3n -u |
          tail -1 |
          tr -d '/')
        if [ -z "$version" ]; then
          echo "no Debian 12 point release found in the archive index" >&2
          exit 1
        fi
        printf '%s' "$version"

targets:
  setup-vms:
    name: "Update DEBIAN_VER in setup-vms.sh"
    kind: file
    sourceid: debian
    scmid: default
    spec:
      file: setup-vms.sh
      matchpattern: 'DEBIAN_VER="(.*)"'
      replacepattern: 'DEBIAN_VER="{{ source "debian" }}"'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      title: 'chore(deps): bump Debian netinst to {{ source "debian" }}'
      labels:
        - dependencies
        - automation
